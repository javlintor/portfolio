name: 🚀 Deploy Astro site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Deploy via SCP
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_IP: ${{ vars.HOSTINGER_IP }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p $HOSTINGER_SSH_PORT $HOSTINGER_IP >> ~/.ssh/known_hosts

          scp -P $HOSTINGER_SSH_PORT -r ./dist/* $HOSTINGER_USER@HOSTINGER_IP:domains/javlintor.com/public_html
